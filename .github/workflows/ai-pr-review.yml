name: AI PR Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    runs-on: ubuntu-latest
    steps:
      - name: AI Code Review
        uses: petarzarkov/gemini-code-review-action@v1.1.3
        with:
          model: ${{ vars.AI_REVIEW_MODEL || 'gemini-3-flash-preview' }}
          language: Chinese
          enable_conversation_context: true
          skip_draft_prs: true
          exclude: '.github/**,docs/**,integration/**,node_modules/**,dist/**,build/**,coverage/**,**/*.md,**/*.txt,**/*.lock,**/*.snap,pnpm-lock.yaml,package-lock.json,yarn.lock'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
